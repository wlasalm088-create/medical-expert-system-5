<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Medical Expert System</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>

<body>

<div class="particles">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="intro" id="intro">
  <h1 class="title">🩺 نظام التشخيص الطبي</h1>

  <div class="start-card">
    <p>ابدأ فحص الأعراض الآن</p>
    <button class="start-btn" onclick="start()">🚀 بدء التشخيص</button>
  </div>
</div>

<div class="main" id="main" style="display:none;">
  <div id="box">
    <p id="question">هل لديك حرارة؟</p>

    <div class="answers">
      <button onclick="answer('yes')">نعم</button>
      <button onclick="answer('no')">لا</button>
    </div>
  </div>

  <p id="result"></p>
</div>

<div class="loading" id="loading" style="display:none;">
  <div class="pulse"></div>
  <p>🧠 جاري تحليل الأعراض...</p>
</div>

<footer class="footer">
  <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

  <div class="name">
    <span>👩‍💻 Developed by</span>
    <span>ولاء سالم النويس</span>
  </div>
</footer>

</body>
</html>
